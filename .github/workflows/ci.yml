name: CI

on:
  # Every pull request, whatever its base (main, develop, feature/skill/stacked branches)
  pull_request:
  push:
    branches:
      - main
      - develop

# Automatically cancel previous runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout docli
        uses: actions/checkout@v4
        with:
          repository: randlee/docli
          ref: develop
          path: docli

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install docli CLI (from GitHub)
        working-directory: docli
        run: cargo build --release -q --bin docli

      - name: Build docli-dotnet tool
        working-directory: docli
        run: dotnet build dotnet/Docli.sln -c Release --nologo

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"./TestResults/**/coverage.cobertura.xml" -targetdir:"./TestResults/CoverageReport" -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: Add coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: ./TestResults/CoverageReport/SummaryGithub.md

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/

      - name: Publish coverage summary
        if: always() && hashFiles('./TestResults/CoverageReport/SummaryGithub.md') != ''
        run: cat ./TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  plugin:
    name: Plugin scripts, sync and viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout docli
        uses: actions/checkout@v4
        with:
          repository: randlee/docli
          ref: develop
          path: docli

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Setup .NET SDKs for real-store tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install pinned Oxigraph CLI
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=oxigraph_v0.5.8_x86_64_linux_gnu ;;
            macOS) asset=oxigraph_v0.5.8_aarch64_apple ;;
            Windows) asset=oxigraph_v0.5.8_x86_64_windows_msvc.exe ;;
            *) echo "Unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/oxigraph"
          gh release download v0.5.8 --repo oxigraph/oxigraph --pattern "$asset" --dir "$RUNNER_TEMP/oxigraph"
          if [ "$RUNNER_OS" = Windows ]; then
            mv "$RUNNER_TEMP/oxigraph/$asset" "$RUNNER_TEMP/oxigraph/oxigraph.exe"
            "$RUNNER_TEMP/oxigraph/oxigraph.exe" --version | grep -F 0.5.8
          else
            mv "$RUNNER_TEMP/oxigraph/$asset" "$RUNNER_TEMP/oxigraph/oxigraph"
            chmod +x "$RUNNER_TEMP/oxigraph/oxigraph"
            "$RUNNER_TEMP/oxigraph/oxigraph" --version | grep -F 0.5.8
          fi
          echo "$RUNNER_TEMP/oxigraph" >> "$GITHUB_PATH"

      - name: Build extractor for real-store tests
        run: dotnet build RoslynToRdf.sln --configuration Release

      - name: Skill copies match their masters (tools/rg, ontology, viewer, ontology reference)
        run: python scripts/check_plugin_sync.py

      - name: Plugin and sync tests
        run: python -m pytest tools/rg/tests scripts/tests -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Viewer tests
        working-directory: viewer
        shell: bash
        run: npm ci && npm test
