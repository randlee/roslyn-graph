name: Prepare Homebrew update

# Deliberately manual: publishing is never coupled to release creation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub Release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-update-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify published release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python .github/scripts/distribution_channels.py verify
          --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --output release-assets

      - name: Require a configured tap repository
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: test -n "$TAP_REPOSITORY" || { echo 'Set repository variable HOMEBREW_TAP_REPOSITORY.' >&2; exit 1; }

      - name: Require tap write credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { echo 'Set secret HOMEBREW_TAP_TOKEN with write access to the configured tap.' >&2; exit 1; }

      - name: Checkout configured tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render formula from verified assets
        env:
          FORMULA_PATH: ${{ vars.HOMEBREW_FORMULA_PATH || 'Formula/roslyn-graph.rb' }}
        run: >-
          python .github/scripts/distribution_channels.py homebrew
          --verified release-assets/verified-release.json
          --output "homebrew-tap/$FORMULA_PATH"

      - name: Validate formula and update tap idempotently
        env:
          FORMULA_PATH: ${{ vars.HOMEBREW_FORMULA_PATH || 'Formula/roslyn-graph.rb' }}
          RELEASE_VERSION: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap
          ruby -c "$FORMULA_PATH"
          git add -- "$FORMULA_PATH"
          if git diff --cached --quiet; then
            echo 'Configured formula already matches the verified release.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update roslyn-graph ${RELEASE_VERSION}"
          branch="$(git branch --show-current)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "$branch"
            if git diff --quiet "origin/${branch}" -- "$FORMULA_PATH"; then
              echo 'Remote formula already matches the verified release.'
              exit 0
            fi
            git rebase "origin/${branch}"
          done
          echo 'Could not update tap after five safe push attempts.' >&2
          exit 1
